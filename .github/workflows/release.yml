name: Release

on:
  release:
    types: [published]

permissions:
  actions: write

jobs:
  # Pages only takes deployments from main, so a release asks for one there instead of deploying its tag.
  deploy:
    runs-on: ubuntu-latest
    steps:
      - run: gh workflow run deploy.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
